# Zip Flip, XcodeGen project definition. The .xcodeproj is generated from this
# file by `xcodegen generate` (scripts do it for you) and is not committed.
#
# Two targets, because the App Store has no watchOS platform: an empty iOS
# container (ZipFlip) carries the real watchOS app (ZipFlipWatch) embedded
# under Watch/. Only the container is archived and uploaded. See README.md
# decision 10 and the comments below.
name: ZipFlip
options:
  bundleIdPrefix: app.zip-flip
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    # Bump CURRENT_PROJECT_VERSION in both targets before every re-upload.
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal

# Local Swift package with all logic that touches neither SwiftUI nor the
# network; `swift test` in ZipFlipCore/ runs its tests on the Mac.
packages:
  ZipFlipCore:
    path: ZipFlipCore

schemes:
  # Archive this one for the App Store (scripts/release.sh).
  ZipFlip:
    build:
      targets:
        ZipFlip: all
    run:
      config: Debug
    archive:
      config: Release
  # Build and run this one during development (scripts/run.sh, scripts/check-ui.sh).
  ZipFlipWatch:
    build:
      targets:
        ZipFlipWatch: all
    run:
      config: Debug

targets:
  ZipFlip:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ZipFlipContainer
    dependencies:
      - target: ZipFlipWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.zip-flip.ZipFlip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Zip Flip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # NO, or the archive has an empty Products folder and nothing to export.
        SKIP_INSTALL: NO

  ZipFlipWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZipFlip
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: ZipFlip/Info.plist
      properties:
        CFBundleDisplayName: Zip Flip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: ZipFlipCore
    entitlements:
      path: ZipFlip/ZipFlip.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:zip-flip.app
    settings:
      base:
        # Must be the container's identifier plus ".watchkitapp".
        PRODUCT_BUNDLE_IDENTIFIER: app.zip-flip.ZipFlip.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
